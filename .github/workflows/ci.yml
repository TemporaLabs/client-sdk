name: CI

# The source and generation checks, typecheck, tests, the text scan of files and commit messages, and the
# client-pack check, on every push to a version branch (vX.Y.Z or release/vX.Y.Z) or main and on every
# pull request into one. This workflow publishes nothing.
on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+', 'release/v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+', 'release/v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile, with no install scripts
        run: npm ci --ignore-scripts
      - name: The API document matches its recorded source
        run: npm run check:source
      - name: The generated client matches the API document
        run: npm run check:generated
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (one worker)
        run: npm test
      - name: Text scan of the files
        run: npm run check:public-text
      - name: Text scan of every commit message
        # A merge or squash title carries this repository's own pull-request number ("Merge pull request #N ...",
        # "<subject> (#N)"); the scan drops that number from the subject line alone and scans everything else.
        run: node scripts/public-text/scan.mjs --commits
      - name: The client package packs clean and installs in a clean project
        run: npm run check:client-pack
