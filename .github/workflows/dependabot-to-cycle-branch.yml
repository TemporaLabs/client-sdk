name: Dependabot PRs go to the cycle branch

# Dependabot opens its PRs against main, so a bump could be released without first running with the
# rest of the cycle's changes. This moves each one onto the current cycle branch (the newest vX.Y.Z or
# release/vX.Y.Z). If that branch is already released (its vX.Y.Z or vX.Y.Z-alpha tag exists, next cycle
# not cut), the PR stays on main; cutting the next cycle branch is when it moves.
#
# A moved PR's checks were computed against main: a base change made with this token starts no
# workflow, so close and reopen the PR (or push to it) before trusting them. A lockfile conflict on
# the new base means regenerating the lockfile by hand.
#
# GitHub runs pull_request_target from the default branch only, so this takes effect once on main.
# It never checks out or runs the PR's code.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: dependabot-to-cycle-${{ github.event.pull_request.number }}

jobs:
  retarget:
    # edited and synchronize catch a PR that Dependabot put back on main, for example on a recreate.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Move the PR to the cycle branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          names=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          # Rank on the version alone, so a vX.Y.Z and a release/vX.Y.Z branch sort together. If both forms of one
          # version exist, the tie goes to the bare vX.Y.Z: equal versions
          # fall back to comparing whole lines, where release/ sorts before v, and the last line wins.
          cycle=$(printf '%s\n' "$names" | { grep -E '^(release/)?v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | awk '{ v = $0; sub(/^release\//, "", v); print v "\t" $0 }' | sort -V -k1,1 | tail -n 1 | cut -f2)
          if [ -z "$cycle" ]; then
            echo "No version branch exists; PR #$PR stays on main."
            exit 0
          fi
          # Released means its release tag exists, however the release reached main. Only a 404 means "not released": any
          # other failure (a 5xx, a rate limit) stops the step rather than move the PR onto a branch that may have shipped.
          version=${cycle#release/}
          for tag in "$version" "$version-alpha"; do
            if out=$(gh api "repos/$REPO/git/ref/tags/$tag" --silent 2>&1); then
              echo "$cycle is already released to main (tag $tag); PR #$PR stays on main."
              exit 0
            elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
              echo "Could not tell whether $cycle is released: $out" >&2
              exit 1
            fi
          done
          gh api -X PATCH "repos/$REPO/pulls/$PR" -f base="$cycle" --jq '"PR #\(.number) now targets \(.base.ref)"'
